[global]
   workgroup = WORKGROUP
   server string = Samba Server
   security = user
   # Seguro: solo permite SMBv3, bloquea acceso anonimo y desactiva enlaces simbolicos externos
   server min protocol = SMB3
   server max protocol = SMB3
   restrict anonymous = 2
   map to guest = Never
   ntlm auth = disabled
   follow symlinks = no

[privado]
   path = /srv/samba/privado
   browsable = no
   writable = yes
   guest ok = no
   valid users = usuario_seguro
   read only = no
