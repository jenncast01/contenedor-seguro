listen=YES
listen_ipv6=NO
# Seguro: deshabilita acceso anonimo y enjaula a los usuarios locales (chroot)
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
connect_from_port_20=YES
chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
ftpd_banner=FTP Server Ready
pasv_enable=YES
pasv_min_port=21106
pasv_max_port=21110
pasv_address=127.0.0.1
